name: Process Labeled Issues

on:
  issues:
    types: [labeled]

jobs:
  update_game_version:
    name: Update Game Version
    if: github.event.label.name == 'gameVersion Update' && github.repository == 'KopterBuzz/NOMNOM'
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Parse Issue to JSON
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_ID: ${{ github.event.issue.number }}
        run: |
          .\.github\scripts\parse_issue.ps1 -IssueBody $env:ISSUE_BODY -IssueId $env:ISSUE_ID

      - name: Report Failure
        if: failure() && steps.parse.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorText = Get-Content error.txt -Raw -ErrorAction SilentlyContinue
          if (-not $ErrorText) { $ErrorText = "An error occurred during parsing." }
          $Body = '❌ **Validation Failed:**' + "`n`n" + '```text' + "`n" + $ErrorText + "`n" + '```'
          gh issue comment ${{ github.event.issue.number }} -b $Body

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gameVersionUpdateCache/
          git commit -m "Update gameVersion cache for issue #${{ github.event.issue.number }}"
          git pull
          git push

      - name: Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close ${{ github.event.issue.number }} --reason "completed"

  update_mod_image:
    name: Update Mod Image
    if: github.event.label.name == 'Mod Image Update' && github.repository == 'KopterBuzz/NOMNOM'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Parse Issue
        id: parse
        shell: pwsh
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_ID: ${{ github.event.issue.number }}
        run: |
          .\.github\scripts\parse_mod_image_issue.ps1 -IssueBody $env:ISSUE_BODY -IssueId $env:ISSUE_ID
      - name: Report Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorText = Get-Content error.txt -Raw -ErrorAction SilentlyContinue
          if (-not $ErrorText) { $ErrorText = "An error occurred during parsing." }
          $Body = '❌ **Validation Failed:** Please check the workflow logs for details.' + "`n`n" + '```text' + "`n" + $ErrorText + "`n" + '```'
          gh issue comment ${{ github.event.issue.number }} -b $Body
        shell: pwsh

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modImageUpdateCache/
          git commit -m "Update modImage cache for issue #${{ github.event.issue.number }}"
          git pull
          git push

      - name: Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close ${{ github.event.issue.number }} --reason "completed"

  update_client_server_status:
    name: Update isClientOrServer
    if: github.event.label.name == 'isClientOrServer Update' && github.repository == 'KopterBuzz/NOMNOM'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Parse Issue
        id: parse
        shell: pwsh
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_ID: ${{ github.event.issue.number }}
        run: |
          .\.github\scripts\parse_isClientOrServer_issue.ps1 -IssueBody $env:ISSUE_BODY -IssueId $env:ISSUE_ID

      - name: Report Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorText = Get-Content error.txt -Raw -ErrorAction SilentlyContinue
          if (-not $ErrorText) { $ErrorText = "An error occurred during parsing." }
          $Body = '❌ **Validation Failed:** Please check the workflow logs for details.' + "`n`n" + '```text' + "`n" + $ErrorText + "`n" + '```'
          gh issue comment ${{ github.event.issue.number }} -b $Body
        shell: pwsh

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add isClientOrServerUpdateCache/
          git commit -m "Update Client/Server cache for issue #${{ github.event.issue.number }}"
          git pull
          git push

      - name: Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close ${{ github.event.issue.number }} --reason "completed"
